groups:
  - name: derma-production
    rules:
      - alert: BackendDown
        expr: up{job="derma-prod-backend"} == 0
        for: 1m
        labels: { severity: critical, env: prod }
        annotations:
          summary: "DermaAI production backend is DOWN"
          description: "Prometheus has not been able to scrape derma-prod-backend for over 1 minute."

      - alert: HighErrorRate
        expr: |
          100 * sum(rate(http_requests_total{job="derma-prod-backend", status="5xx"}[5m]))
              / sum(rate(http_requests_total{job="derma-prod-backend"}[5m])) > 5
        for: 2m
        labels: { severity: critical, env: prod }
        annotations:
          summary: "More than 5% of requests are failing with 5xx errors"
          description: "5xx error rate is {{ $value | printf \"%.1f\" }}% over the last 5 minutes."

      - alert: SlowResponses
        # 3 s because Gemini image analysis is naturally slow. Tune this after you have watched real traffic.
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_highr_seconds_bucket{job="derma-prod-backend"}[5m]))) > 3
        for: 5m
        labels: { severity: warning, env: prod }
        annotations:
          summary: "95th percentile response time is above 3 seconds"
          description: "p95 latency is {{ $value | printf \"%.2f\" }} s."

      - alert: HighMemory
        expr: process_resident_memory_bytes{job="derma-prod-backend"} > 600 * 1024 * 1024
        for: 5m
        labels: { severity: warning, env: prod }
        annotations:
          summary: "Backend is using more than 600 MB of memory"
          description: "Resident memory is {{ $value | humanize1024 }}B."
