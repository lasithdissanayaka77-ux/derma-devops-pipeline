global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # The app containers join the shared 'devops' network, so Prometheus reaches them by container name.
  - job_name: derma-prod-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['derma-prod-backend:8000']
        labels: { env: prod }

  - job_name: derma-staging-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['derma-staging-backend:8000']
        labels: { env: staging }

  # Optional bonus: Jenkins' own build metrics (needs the 'prometheus' plugin; delete this job if it shows 403)
  - job_name: jenkins
    metrics_path: /prometheus
    static_configs:
      - targets: ['jenkins:8080']
