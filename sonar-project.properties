# SonarQube analysis settings (read by sonar-scanner in the 'Code Quality' stage)
sonar.projectKey=derma-ai
sonar.projectName=DermaAI
sonar.sourceEncoding=UTF-8

# What to analyse
# NOTE: frontend/src is intentionally excluded here. The containerised SonarQube
# JS/TS analyzer needs to spawn a Node.js "bridge server" subprocess, which times
# out after 300s in this Jenkins container (Node.js bridge server incompatibility
# in the containerised scanner environment). Frontend code is still fully covered
# by the Test stage (Vitest: 106 tests, coverage report archived) - it just isn't
# additionally scanned by SonarQube. Python (backend/app) is scanned in full.
sonar.sources=backend/app

# Files inside the sources that are tests (so they are not counted as production code)
sonar.test.inclusions=**/tests/**,**/test_*.py

# Things that should never be analysed or counted against coverage
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.venv/**,**/media/**,**/alembic/versions/**,**/*.d.ts
sonar.coverage.exclusions=**/alembic/**,**/seed_*.py,**/*.config.*,**/tests/**,**/*.test.*

# Coverage reports produced by the 'Test' stage
sonar.python.version=3.11
sonar.python.coverage.reportPaths=reports/backend-coverage.xml