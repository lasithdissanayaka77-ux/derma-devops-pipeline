# SonarQube analysis settings (read by sonar-scanner in the 'Code Quality' stage)
sonar.projectKey=derma-ai
sonar.projectName=DermaAI
sonar.sourceEncoding=UTF-8

# What to analyse  (ADJUST if your folders differ)
sonar.sources=backend/app,frontend/src

# Files inside the sources that are tests (so they are not counted as production code)
sonar.test.inclusions=**/tests/**,**/test_*.py,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Things that should never be analysed or counted against coverage
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.venv/**,**/media/**,**/alembic/versions/**,**/*.d.ts
sonar.coverage.exclusions=**/alembic/**,**/seed_*.py,**/main.jsx,**/main.tsx,**/*.config.*,**/tests/**,**/*.test.*

# Coverage reports produced by the 'Test' stage
sonar.python.version=3.11
sonar.python.coverage.reportPaths=reports/backend-coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
